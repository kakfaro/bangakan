<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەخشکردنی ڤیدیۆی Mega</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #38bdf8;
        }

        .player-card {
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background-color: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .actions {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
        }

        .btn {
            background: #0284c7;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h1>پەخشکەری ڤیدیۆ (Mega.nz)</h1>

    <div class="player-card">
        <div class="video-wrapper">
            <!-- بەکارهێنانی پروکسی embed بۆ لێدانی فایلی mega -->
            <iframe 
                src="https://mega.nz/embed/oUlQHArQ#PQecYQm2JN0fTgjVeeO81gZsg21H65mbN_43QBk1RIE" 
                allowfullscreen 
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
        <div class="actions">
            <span>ڤیدیۆی هەڵبژێردراو</span>
            <a href="https://mega.nz/file/oUlQHArQ#PQecYQm2JN0fTgjVeeO81gZsg21H65mbN_43QBk1RIE" target="_blank" class="btn">کردنەوە لە Mega</a>
        </div>
    </div>

</body>
</html>
